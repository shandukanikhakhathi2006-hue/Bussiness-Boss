<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a BusinessBoss account.">
  <title>BusinessBoss | Create an account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="public.css">
</head>
<body class="auth-page">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <main class="auth-layout" id="main-content">
    <section class="auth-panel" aria-labelledby="auth-title">
      <div class="auth-card">
        <a href="index.html" class="brand auth-brand" aria-label="BusinessBoss home"><img src="images/BussinessBoss-logo-2.jpeg.jpeg" alt="" class="brand-mark"><span>Business<span>Boss</span></span></a>
        <div class="auth-heading"><p class="eyebrow">Create account</p><h1 id="auth-title">Set up your BusinessBoss account.</h1><p>Add your details to get started.</p></div>
        <form class="signup-form">
          <p data-script-message role="alert" class="form-alert" hidden><span data-script-message-text></span></p>
          <label>Full name<input type="text" name="full-name" id="fullname" autocomplete="name" required minlength="2" maxlength="80"></label>
          <label>Email address<input type="email" name="email" id="email" autocomplete="email" required></label>
          <div class="form-grid"><label>Password<input type="password" name="password" id="password" autocomplete="new-password" required minlength="12"></label><label>Confirm password<input type="password" name="confirm-password" id="confirm-password" autocomplete="new-password" required></label></div>
          <button type="submit" class="signup-btn">Create account <span aria-hidden="true">→</span></button>
        </form>
        <div class="divider"><span>or continue with</span></div>
        <button class="google-btn" type="button"><img src="images/Logo-google-icon-PNG.png" alt="" class="google-icon">Continue with Google</button>
        <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </section>
  </main>
  <footer class="site-footer auth-footer"><a href="index.html" class="brand" aria-label="BusinessBoss home"><img src="images/BussinessBoss-logo-2.jpeg.jpeg" alt="" class="brand-mark"><span>Business<span>Boss</span></span></a><p>© 2026 BusinessBoss</p><div><a href="features.html">Features</a><a href="pricing.html">Pricing</a><a href="Contact.html">Contact</a></div></footer>
  <script src="script.js" type="module"></script>
</body>
</html>
