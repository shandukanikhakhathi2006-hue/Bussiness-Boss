<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Create a BusinessBoss account to manage your business.">
        <title>BusinessBoss |sign up</title>
        <link rel="stylesheet" href="signup.css">
    </head>
    <body>
        <header class="header">
            <div class="logo-container">
                <img src="images/BussinessBoss-logo.jpeg" alt="Bussiness Boss logo" class="bussinessBoss-logo">
            </div>
            <div class="headings">
                <h1>Create Your Account</h1>
                <h2>Start managing your business smarter today.</h2>
             </div>
        </header>
        <main class="main">
            <section class="signup-section">
                <form action="" class="signup-form">
                    <div class="input-container">
                        <label for="fullname">
                            Full name
                        </label>
                        <input type="text" name="full-name" id="fullname" placeholder="e.g John smith" required minlength="6" maxlength="40">
                    </div>
                    <div class="input-container">
                        <label for="email">
                            Email
                        </label>
                        <input type="email" name="email" id="email" placeholder="example@gmail.com" minlength="6" maxlength="40" required>
                    </div>
                    <div class="input-container">
                        <label for="password">
                           Password
                        </label>
                        <input type="password" name="password" id="password" placeholder="Enter a strong password" minlength="12" maxlength="40" required>
                    </div>
                    <div class="input-container">
                        <label for="confirm-password">
                            Confirm password
                        </label>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter your password" required>
                    </div>
                    <div class="signup-btn-container">
                    <button type="submit" class="signup-btn">Create Account</button>
                    </div>
                </form>
                <p class="login">Already have an account? <a href="login.html">Login</a></p>
                <p class="choice">OR</p>
                <div class="google-btn-container">
                <button  class="google-btn">
                    <img class="google-icon" src="images/Logo-google-icon-PNG.png" alt="Google-logo-icon">
                    <span>Continue with Google</span>
                </button>
            </div>
            </section>

        </main>
    </body>
</html>
