<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="login.css">
        <title>BusinessBoss | login </title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <meta name="description" content="login to your account to get staretd">
    </head>
    <body>
        <header>
            <div class="logo-container">
                <img src="images/BussinessBoss-logo.png" alt="Bussiness Boss logo" class="bussinessBoss-logo">
            </div>
            <div class="headings">
                <h1>Welcome Back</h1>
                <h2>Login to your account.</h2>
             </div>
        </header>
        <main>
            <section>
            <form action="" class="login-container"  method="POST">
                <div class="input-container">
                    <input type="email" id="email" name="email" placeholder="Enter your email" minlength="12" maxlength="60" required>
                </div>
                <div class="input-container">
                    <input type="password" id="password" name="password" placeholder="Password" minlength="12" maxlength="40" required>
                </div>
                <div class="support">
                    <div class="checkbox-container">
                    <input type="checkbox" name="remeber-me" value="yes" id="remember-me">
                    <label for="remember-me">Remember me</label>
                </div>
                <div class="forgot-password">
                    <a href="#">Forgot password</a>
                </div>
                </div>
                <div class="login-btn-container">
                    <button>Login</button>
                </div>
            </form>
            <p class="signup-message">Don't have an accont? <a href="signup.html">create an account</a></p>
                <p class="choice">or</p>
                <div class="google-btn-container">
                <button  class="google-btn">
                    <img class="google-icon" src="images/Logo-google-icon-PNG.png" alt="Goggle logo icon">
                    <span>Continue with Google</span>
                </button>
            </div>
        </section>
        </main>
    </body>
</html>
