<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your BusinessBoss workspace.">
  <title>BusinessBoss | Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="public.css">
</head>
<body class="auth-page">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <main class="auth-layout" id="main-content">
    <section class="auth-panel" aria-labelledby="auth-title">
      <div class="auth-card">
        <a href="index.html" class="brand auth-brand" aria-label="BusinessBoss home"><img src="images/BussinessBoss-logo-2.jpeg.jpeg" alt="" class="brand-mark"><span>Business<span>Boss</span></span></a>
        <div class="auth-heading"><p class="eyebrow">Welcome back</p><h1 id="auth-title">Log in to BusinessBoss</h1><p>Enter your details to continue to your workspace.</p></div>
        <form class="login-container" novalidate>
          <p data-script-message role="alert" class="form-alert" hidden><span data-script-message-text></span></p>
          <label>Email address<input type="email" id="email" name="email" autocomplete="email" required></label>
          <label>Password<input type="password" id="password" name="password" autocomplete="current-password" required></label>
          <div class="form-options"><label class="checkbox-label"><input type="checkbox" id="remember-me" name="remember-me"> Remember me</label><a href="forgot-password.html">Forgot password?</a></div>
          <button type="submit">Log in <span aria-hidden="true">→</span></button>
        </form>
        <div class="divider"><span>or continue with</span></div>
        <button class="google-btn" type="button"><img src="images/Logo-google-icon-PNG.png" alt="" class="google-icon">Continue with Google</button>
        <p class="auth-switch">New to BusinessBoss? <a href="signup.html">Create an account</a></p>
      </div>
    </section>
  </main>
  <footer class="site-footer auth-footer"><a href="index.html" class="brand" aria-label="BusinessBoss home"><img src="images/BussinessBoss-logo-2.jpeg.jpeg" alt="" class="brand-mark"><span>Business<span>Boss</span></span></a><p>© 2026 BusinessBoss</p><div><a href="features.html">Features</a><a href="pricing.html">Pricing</a><a href="Contact.html">Contact</a></div></footer>
  <script src="script.js" type="module"></script>
</body>
</html>
